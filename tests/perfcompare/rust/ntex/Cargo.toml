[package]
name = "perf-ntex"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "perf-ntex"
path = "src/main.rs"

[dependencies]
ntex = { version = "=4.3.0", features = ["rustls", "compress", "cookie", "ws"] }
ntex-files = "4.1.0"
ntex-cors = "4.1.1"
serde = { version = "1", features = ["derive"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
